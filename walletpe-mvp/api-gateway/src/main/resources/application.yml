server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:walletpe-user-service}
  audience: ${JWT_AUDIENCE:walletpe-api}

internal-service:
  shared-secret: ${INTERNAL_SERVICE_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

gateway:
  trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:*}

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8085}
  kyc-service:
    url: ${KYC_SERVICE_URL:http://localhost:8082}
  wallet-service:
    url: ${WALLET_SERVICE_URL:http://localhost:8083}
  transaction-service:
    url: ${TRANSACTION_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.walletpe.gateway: INFO
    org.springframework.cloud.gateway: INFO
